<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Stream Speech Layer 設定</title>
    <style>
      body {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 20px 40px;
        color: #181b20;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .subtitle {
        margin: 0 0 20px;
        color: #5f6875;
        font-size: 13px;
      }

      .card {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #e2e5ea;
        border-radius: 10px;
        background: #fafbfc;
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        padding: 8px;
        font: inherit;
      }

      button {
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #1565c0;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        background: #4b5563;
      }

      .hint {
        margin-top: 6px;
        color: #5f6875;
        font-size: 12px;
      }

      .toggle-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .toggle-row input {
        width: auto;
        margin: 0;
      }

      .inline-actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: end;
      }

      .inline-actions input {
        margin-top: 6px;
      }

      .inline-actions button {
        margin-top: 6px;
        min-width: 72px;
      }

      .key-status {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      .key-status.saved {
        color: #15803d;
      }

      .key-status.empty {
        color: #9a3412;
      }

      .footer {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 20px;
      }

      #status {
        font-weight: 700;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Stream Speech Layer 設定</h1>
    <p class="subtitle">認識・翻訳の設定と API キーを管理します。</p>

    <div class="card">
      <h2>音声認識</h2>
      <label for="provider">認識エンジン</label>
      <select id="provider">
        <option value="none">未設定</option>
        <option value="groq">Groq Whisper API</option>
      </select>

      <label for="language">配信音声の言語</label>
      <select id="language">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="auto">自動</option>
      </select>

      <label for="groqKey">Groq API キー</label>
      <div class="inline-actions">
        <input id="groqKey" type="password" autocomplete="off" placeholder="新しいキーを入力" />
        <button id="clearGroqKey" class="secondary" type="button">削除</button>
      </div>
      <div id="groqKeyStatus" class="key-status empty">未保存</div>
    </div>

    <div class="card">
      <h2>翻訳</h2>
      <label class="toggle-row" for="translationEnabled">
        <input id="translationEnabled" type="checkbox" />
        音声認識後に翻訳する
      </label>

      <label for="targetLanguage">翻訳先言語</label>
      <select id="targetLanguage">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
      </select>

      <label for="translationProvider">翻訳エンジン</label>
      <select id="translationProvider">
        <option value="google">Google Translate</option>
        <option value="deepl">DeepL API</option>
      </select>

      <label for="deeplKey">DeepL API キー</label>
      <div class="inline-actions">
        <input id="deeplKey" type="password" autocomplete="off" placeholder="DeepL Free は末尾に :fx" />
        <button id="clearDeepLKey" class="secondary" type="button">削除</button>
      </div>
      <div id="deeplKeyStatus" class="key-status empty">未保存</div>
    </div>

    <div class="footer">
      <button id="saveSettings">設定を保存</button>
      <div id="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
