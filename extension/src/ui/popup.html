<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Stream Speech Layer</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px;
        color: #181b20;
        font-family: Arial, sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        padding: 8px;
        font: inherit;
        border: 0;
        border-radius: 6px;
        background: #1565c0;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      #openOptions {
        width: auto;
        margin: 0;
        padding: 6px 8px;
        background: transparent;
        color: #4b5563;
        font-size: 18px;
        line-height: 1;
      }

      #openOptions:hover {
        color: #1565c0;
      }

      #status {
        margin-top: 8px;
        font-weight: 700;
      }

      .hint {
        margin-top: 6px;
        color: #5f6875;
        font-size: 12px;
        line-height: 1.4;
      }

      h2 {
        font-size: 14px;
        margin: 14px 0 0;
      }

      ul {
        max-height: 220px;
        overflow: auto;
        margin: 8px 0 0;
        padding-left: 18px;
      }

      li {
        margin-bottom: 6px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Stream Speech Layer</h1>
      <button id="openOptions" type="button" title="設定を開く">⚙</button>
    </div>
    <button id="toggle">開始する</button>
    <div id="status">停止中</div>
    <div id="target" class="hint"></div>
    <div class="hint">開始すると現在の YouTube / Twitch タブ音声だけを取得します。設定は⚙から変更できます。</div>

    <h2>最近の文字起こし</h2>
    <ul id="log"></ul>
    <script src="popup.js"></script>
  </body>
</html>
